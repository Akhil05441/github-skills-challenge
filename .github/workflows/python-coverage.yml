name: Python Coverage
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install test and coverage tools
        run: |
          python -m pip install pytest-cov coverage

      - name: Run tests and generate coverage details
        run: |
          python -m pytest -vv --cov=src --cov-report=term-missing --cov-report=xml --maxfail=1

      - name: Publish coverage comment on pull request
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERAGE_PATH: coverage.xml
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 80

      - name: Enforce minimum coverage
        run: |
          coverage report --fail-under=90
